<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Funds | Horizon Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-50 min-h-screen font-sans">

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center cursor-pointer"
                        onclick="window.location.href='dashboard.html'">
                        <div
                            class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center mr-2 shadow-md">
                            <span class="font-bold text-lg">H</span>
                        </div>
                        <span class="font-bold text-xl text-gray-900 tracking-tight">Horizon Bank</span>
                    </div>
                    <div class="hidden sm:ml-8 sm:flex sm:space-x-8">
                        <a href="dashboard.html"
                            class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">Dashboard</a>
                        <a href="account.html"
                            class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">Accounts</a>
                        <a href="transfer.html"
                            class="border-blue-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Transfer</a>
                        <a href="billpay.html"
                            class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">Bill
                            Pay</a>
                    </div>
                </div>
                <div class="flex items-center">
                    <button id="logout-btn"
                        class="text-gray-500 hover:text-red-600 px-3 py-2 rounded-md text-sm font-medium transition-colors flex items-center">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10 fade-in">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 px-8 py-6 text-white text-center">
                <h1 class="text-2xl font-bold">Transfer Funds</h1>
                <p class="text-blue-100 text-sm mt-1">Move money swiftly and securely</p>
            </div>

            <div class="p-8">
                <form id="transfer-form" class="space-y-6">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- From Account -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">From Account</label>
                            <select id="from-account" required class="input-base bg-gray-50 focus:bg-white">
                                <option value="" disabled selected>Select Source Account</option>
                            </select>
                            <p id="from-balance" class="text-xs text-gray-500 mt-2 ml-1 hidden">Available Balance: <span
                                    class="font-medium text-gray-800"></span></p>
                        </div>

                        <!-- Transfer Type -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Transfer Type</label>
                            <div class="flex items-center space-x-4 bg-gray-50 p-2 rounded-xl">
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="transfer-type" value="internal" checked
                                        class="w-4 h-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                    <span class="ml-2 text-sm text-gray-700">Internal</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="transfer-type" value="external"
                                        class="w-4 h-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                    <span class="ml-2 text-sm text-gray-700">External</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- To Account (Internal) -->
                    <div id="internal-to-container">
                        <label class="block text-sm font-medium text-gray-700 mb-2">To Account</label>
                        <select id="to-account-internal" class="input-base bg-gray-50 focus:bg-white">
                            <option value="" disabled selected>Select Destination Account</option>
                        </select>
                    </div>

                    <!-- To Account (External) -->
                    <div id="external-to-container" class="hidden space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Routing Number</label>
                            <input type="text" id="routing-number" placeholder="9-digit routing number"
                                class="input-base bg-gray-50 focus:bg-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Account Number</label>
                            <input type="text" id="external-account-number" placeholder="Destination account number"
                                class="input-base bg-gray-50 focus:bg-white">
                        </div>
                    </div>

                    <!-- Amount & Description -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-gray-100">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Amount</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <span class="text-gray-500 sm:text-lg">$</span>
                                </div>
                                <!-- Ошибка 8: Можно вводить буквы или отрицательные числа. Вводится текст, явная проверка JavaScript, предотвращающая ввод букв или отрицательных знаков, отсутствует. -->
                                <input type="text" id="amount" required placeholder="0.00"
                                    class="input-base pl-8 text-lg font-medium bg-gray-50 focus:bg-white">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Description (Optional)</label>
                            <input type="text" id="description" placeholder="What's this for?"
                                class="input-base bg-gray-50 focus:bg-white">
                        </div>
                    </div>

                    <div class="pt-6 flex justify-end space-x-3">
                        <button type="button" onclick="window.location.href='dashboard.html'"
                            class="px-6 py-3 border border-gray-300 shadow-sm text-sm font-medium rounded-xl text-gray-700 bg-white hover:bg-gray-50 focus:outline-none transition-colors">
                            Cancel
                        </button>
                        <button type="button" id="submit-transfer"
                            class="btn-primary w-40 flex justify-center items-center py-3 px-6 border border-transparent rounded-xl shadow-md text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none transition-colors">
                            <span>Transfer</span>
                            <svg id="tx-spinner" class="animate-spin ml-2 h-4 w-4 text-white hidden"
                                xmlns="http://www.w3.org/-2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Confirmation Modal -->
        <div id="confirm-modal" class="fixed z-50 inset-0 hidden overflow-y-auto" aria-labelledby="modal-title"
            role="dialog" aria-modal="true">
            <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity backdrop-blur-sm"
                    aria-hidden="true" id="modal-backdrop"></div>
                <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
                <div
                    class="inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full border border-gray-100">
                    <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4 text-center">
                        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-6">
                            <svg class="h-8 w-8 text-green-600" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M5 13l4 4L19 7" />
                            </svg>
                        </div>
                        <h3 class="text-2xl leading-6 font-bold text-gray-900 mb-2" id="modal-title">Confirm Transfer
                        </h3>
                        <div class="mt-4 bg-gray-50 rounded-xl p-4 text-left">
                            <div class="flex justify-between py-2 border-b border-gray-200">
                                <span class="text-sm font-medium text-gray-500">Amount</span>
                                <span class="text-sm font-bold text-gray-900" id="modal-amount"></span>
                            </div>
                            <div class="flex justify-between py-2 border-b border-gray-200">
                                <span class="text-sm font-medium text-gray-500">From</span>
                                <span class="text-sm font-medium text-gray-900" id="modal-from"></span>
                            </div>
                            <div class="flex justify-between py-2">
                                <span class="text-sm font-medium text-gray-500">To</span>
                                <span class="text-sm font-medium text-gray-900 inline-block text-right"
                                    id="modal-to"></span>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-4 py-4 sm:px-6 sm:flex sm:flex-row-reverse rounded-b-2xl">
                        <button type="button" id="confirm-btn"
                            class="btn-primary w-full inline-flex justify-center rounded-xl border border-transparent shadow-sm px-4 py-3 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 sm:ml-3 sm:w-auto sm:text-sm">
                            Confirm & Send
                        </button>
                        <button type="button" id="cancel-modal-btn"
                            class="mt-3 w-full inline-flex justify-center rounded-xl border border-gray-300 shadow-sm px-4 py-3 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                            Back
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!utils.checkAuth()) return;

            document.getElementById('logout-btn').addEventListener('click', () => utils.logout());

            // Ошибка 12: Кнопка «Отправить» меняет цвет только для пользователя visual_user.
            const user = JSON.parse(localStorage.getItem('user'));
            const submitBtn = document.getElementById('submit-transfer');

            if (user && user.username === 'visual_user') {
                // Change hover to completely chaotic color (e.g. bright pink/yellow)
                submitBtn.classList.remove('hover:bg-blue-700', 'bg-blue-600');
                submitBtn.classList.add('bg-pink-500', 'hover:bg-yellow-400');
            }

            const fromSelect = document.getElementById('from-account');
            const toInternal = document.getElementById('to-account-internal');
            const internalContainer = document.getElementById('internal-to-container');
            const externalContainer = document.getElementById('external-to-container');
            const fromBalance = document.getElementById('from-balance');
            const balanceSpan = fromBalance.querySelector('span');
            const radios = document.querySelectorAll('input[name="transfer-type"]');

            let accountsData = [];

            try {
                const res = await api.getAccounts();
                if (res.ok) {
                    accountsData = await res.json();
                    accountsData.forEach(acc => {
                        const label = `${acc.type} (...${String(acc.id).slice(-4)})`;
                        fromSelect.add(new Option(label, acc.id));
                        toInternal.add(new Option(label, acc.id));
                    });
                }
            } catch (e) {
                console.error(e);
            }

            fromSelect.addEventListener('change', () => {
                const acc = accountsData.find(a => a.id == fromSelect.value);
                if (acc) {
                    balanceSpan.textContent = utils.formatCurrency(acc.balance);
                    balanceSpan.className = acc.balance < 0 ? 'font-medium text-red-600' : 'font-medium text-green-600';
                    fromBalance.classList.remove('hidden');
                }
            });

            radios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'internal') {
                        internalContainer.classList.remove('hidden');
                        externalContainer.classList.add('hidden');
                    } else {
                        internalContainer.classList.add('hidden');
                        externalContainer.classList.remove('hidden');
                    }
                });
            });

            const modal = document.getElementById('confirm-modal');
            const btnText = submitBtn.querySelector('span');
            const spinner = document.getElementById('tx-spinner');

            submitBtn.addEventListener('click', () => {
                const amountVal = document.getElementById('amount').value;
                if (!amountVal || !fromSelect.value) {
                    utils.showToast('Please fill all required fields', 'error');
                    return;
                }

                // Defect 8 allows "abc" which returns NaN in Number("abc")
                // We will pass exactly what the user inputs.

                const isExternal = document.querySelector('input[name="transfer-type"]:checked').value === 'external';
                const toVal = isExternal ? document.getElementById('external-account-number').value : toInternal.value;

                if (!toVal) {
                    utils.showToast('Please specify a destination account', 'error');
                    return;
                }

                document.getElementById('modal-amount').textContent = amountVal; // Not formatting to preserve defect 8
                document.getElementById('modal-from').textContent = accountsData.find(a => a.id == fromSelect.value)?.type + ` (${fromSelect.value})`;
                document.getElementById('modal-to').textContent = isExternal ? `External (${toVal})` : accountsData.find(a => a.id == toInternal.value)?.type + ` (${toInternal.value})`;

                modal.classList.remove('hidden');
            });

            document.getElementById('cancel-modal-btn').addEventListener('click', () => {
                modal.classList.add('hidden');
            });
            document.getElementById('modal-backdrop').addEventListener('click', () => {
                modal.classList.add('hidden');
            });

            document.getElementById('confirm-btn').addEventListener('click', async () => {
                const confirmBtn = document.getElementById('confirm-btn');
                confirmBtn.disabled = true;
                confirmBtn.textContent = 'Processing...';

                const isExternal = document.querySelector('input[name="transfer-type"]:checked').value === 'external';
                const data = {
                    fromAccountId: fromSelect.value,
                    toAccountId: isExternal ? document.getElementById('external-account-number').value : toInternal.value,
                    amount: document.getElementById('amount').value, // send string, allowing defect 8
                    description: document.getElementById('description').value,
                    isExternal: isExternal
                };

                try {
                    const res = await api.transfer(data);
                    const result = await res.json();

                    if (res.ok) {
                        modal.classList.add('hidden');
                        utils.showToast('Transfer completed successfully!', 'success');

                        // Ошибка 7. Настройка: Установите флаг для запуска обработки устаревших данных панели мониторинга.
                        localStorage.setItem('staleDashboard', 'true');

                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1000); // Дайте время для всплывающего уведомления и дождитесь появления дефекта 3, если он применим (дефект 3 добавляет задержку к ответу бэкэнда, поэтому он обрабатывается нативно с помощью await res).
                    } else {
                        modal.classList.add('hidden');
                        utils.showToast(result.error || 'Transfer failed', 'error');
                        confirmBtn.disabled = false;
                        confirmBtn.textContent = 'Confirm & Send';
                    }
                } catch (e) {
                    modal.classList.add('hidden');
                    utils.showToast('Network error processing transfer', 'error');
                    confirmBtn.disabled = false;
                    confirmBtn.textContent = 'Confirm & Send';
                }
            });
        });
    </script>
</body>

</html>
